name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  POSTGRES_VERSION: '13'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowd_farm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Build packages
      run: npm run build

    - name: Run database migrations
      run: npm run db:migrate
      working-directory: packages/control-plane
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: crowd_farm_test
        DB_USER: postgres
        DB_PASSWORD: postgres

    - name: Run tests
      run: npm run test
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: crowd_farm_test
        DB_USER: postgres
        DB_PASSWORD: postgres

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Control Plane image
      uses: docker/build-push-action@v4
      with:
        context: packages/control-plane
        file: packages/control-plane/Dockerfile
        push: true
        tags: |
          crowd-farm/control-plane:latest
          crowd-farm/control-plane:${{ github.sha }}

    - name: Build and push Node Agent image
      uses: docker/build-push-action@v4
      with:
        context: packages/node-agent
        file: packages/node-agent/Dockerfile
        push: true
        tags: |
          crowd-farm/node-agent:latest
          crowd-farm/node-agent:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Deploy to production
      run: |
        echo "Deployment would happen here"
        echo "This would typically involve:"
        echo "1. Updating Kubernetes deployments"
        echo "2. Running database migrations"
        echo "3. Health checks"
        echo "4. Rollback procedures if needed"

